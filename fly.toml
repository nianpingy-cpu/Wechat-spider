app = "wechat-spider-api"
primary_region = "hkg"

[build]
  builder = "paketobuildpacks/builder:base"

[build.buildpacks]
  [[build.buildpacks.buildpacks]]
    url = "paketo-buildpacks/python"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = false

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

[env]
  PORT = "8000"
